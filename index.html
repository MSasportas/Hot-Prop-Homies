<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090812">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hot Prop Homies">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hot Prop Homies</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/orbitron.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-sans-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/ibm-plex-mono-600.woff2" crossorigin>
<style>
/* Hot Prop Homies — combined NBA + NHL. Flame Night / Flame Day brand theme (Nov 2026). */
@font-face{font-family:"Orbitron";src:url("fonts/orbitron.woff2") format("woff2");font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:"Graduate";src:url("fonts/graduate-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-700.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/ibm-plex-mono-500.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url("fonts/ibm-plex-mono-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
:root{
  /* HPH — Flame Night (always dark) */
  --bg:#090812; --surface:#1A163A; --raise:#221E42; --line:#2E2850; --line2:#3D3666;
  --fg:#F0EDF8; --fg2:#C0B8E0; --muted:#9490B8;
  --accent:#17E9FF; --accent-soft:rgba(23,233,255,.12); --accent-rgb:23,233,255; --on-accent:#090812;
  --primary:#E8187A; --on-primary:#FFFFFF; --primary-soft:rgba(232,24,122,.15); --selected-bg:rgba(232,24,122,.15); --selected-text:#F060A8; --cta:#E8187A;
  --good:#22C55E; --good-soft:rgba(34,197,94,.12); --good-rgb:34,197,94;
  --warn:#FFB800; --warn-soft:rgba(255,184,0,.12);
  --bad:#F43F5E; --bad-soft:rgba(244,63,94,.15); --bad-rgb:244,63,94;
  --head:"Orbitron","Graduate",Georgia,serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cond:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --w:clamp(52px,14.5vw,60px); --h:clamp(50px,7.2vh,58px);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px); --sal:env(safe-area-inset-left,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
@keyframes flame-pulse{0%,100%{filter:drop-shadow(0 0 8px rgba(232,24,122,.4));}50%{filter:drop-shadow(0 0 18px rgba(232,24,122,.8)) drop-shadow(0 0 32px rgba(23,233,255,.3));}}
.mascot-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:560px;margin:0 0 0 calc(var(--w) + var(--sal));padding:calc(var(--sat) + 20px) 14px 4px;background:var(--bg)}
@media (min-width:640px){.mascot-wrap{margin-left:calc(var(--w) + 24px)}}
.wordmark{font:900 18px/22px var(--head);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.mascot-hero{display:inline-block;width:88px;animation:flame-pulse 2.4s ease-in-out infinite;}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 30%, #110f1f 0%, #090812 70%);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;
  font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mu{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
[hidden]{display:none!important}

/* page column: everything right of the rail */
.wrap{max-width:560px;margin:0 0 0 calc(var(--w) + var(--sal));padding:0 14px max(calc(28px + var(--sab)),var(--slipH,0px));min-height:100vh}
@media (min-width:640px){.wrap{margin-left:calc(var(--w) + 24px)}}

/* header */
.hdr{position:sticky;top:0;z-index:6;display:flex;align-items:baseline;gap:10px;margin:0 -14px;padding:calc(var(--sat) + 14px) 14px 10px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.hdr h1{font:400 20px/26px var(--head);letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap}
.hdr h1.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hdr .sport-sw{margin-left:auto}
.tag-test{margin:0 -14px;padding:calc(var(--sat) + 3px) 14px 3px;font-size:11px;line-height:16px;color:var(--warn);background:var(--warn-soft);border-bottom:1px solid var(--line)}
.tag-test+.hdr{padding-top:12px;top:0}
/* sport switcher pill */
.sport-sw{display:flex;gap:2px;background:var(--line);border-radius:20px;padding:2px;flex:none;align-items:center}
.sport-sw button{padding:3px 9px;border-radius:18px;font-size:12px;line-height:17px;font-weight:600;color:var(--muted)}
.sport-sw button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* sport badge on pick tiles in All mode */
.sp-badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;line-height:14px;font-weight:700;letter-spacing:.04em;vertical-align:1px;margin-left:5px;flex:none}
.sp-badge.nba{background:rgba(232,24,122,.14);color:#F060A8;box-shadow:inset 0 0 0 1px rgba(232,24,122,.55)}
.sp-badge.nhl{background:rgba(23,233,255,.10);color:#17E9FF;box-shadow:inset 0 0 0 1px rgba(23,233,255,.45)}
/* all-mode sport section headers */
.sport-sec-h{display:flex;align-items:center;gap:6px;margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.sport-sec-h h2{font:400 15px/20px var(--head);margin:0}

/* freshness strip: one tappable line at the top of every tab */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.live{display:inline-block;width:7px;height:7px;margin-right:7px;vertical-align:1px;border-radius:50%;background:var(--accent)}
.live.warn{background:var(--warn)} .live.bad{background:var(--primary)}
.statusline{font-size:12.5px;line-height:17px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline .wt{color:var(--warn);font-weight:600}

/* banners: a 3px meaning bar on the left, plain text */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:12px;border-left:3px solid var(--warn);background:var(--warn-soft);font-size:13.5px;line-height:19px;border-radius:0 6px 6px 0}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-left-color:var(--cta);background:var(--selected-bg)} .banner.stop .ic{color:var(--cta)}
.banner.info{border-left-color:var(--accent);background:var(--accent-soft)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:650;color:var(--fg)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere;color:var(--fg2)}
.linkbtn{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.since{margin-top:12px;font-size:13px;line-height:18px;color:var(--accent);font-weight:600}

/* sections */
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.sec-h h2{font:400 16px/22px var(--head);letter-spacing:.01em;margin:0;flex:1;min-width:0}
.sec-h .mu{font-size:12px;line-height:16px}
.card.empty{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.empty .t{font-size:15px;line-height:21px;font-weight:650;color:var(--fg)}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.note{font-size:13px;line-height:18px;color:var(--muted);margin-top:12px}

/* pick tiles: a 2-column board, newest first; a tapped tile opens full width */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;gap:8px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;padding:10px 10px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tile[role=button]{cursor:pointer}
.tile.open{grid-column:1 / -1;border-color:var(--primary);background:var(--selected-bg)}
.tile.open .nm{color:var(--selected-text)}
.tile .top{display:flex;gap:6px;align-items:center;min-width:0}
.hs{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--raise);border:1px solid var(--line)}
.tile .hs{width:26px;height:26px}
.tile.open .hs{width:30px;height:30px}
.tile .nm{display:block;flex:1;min-width:0;overflow-wrap:normal;word-break:normal;hyphens:none}
.tile .nm .fn,.tile .nm .ln{display:block;min-width:0;overflow:hidden;white-space:nowrap;overflow-wrap:normal;word-break:normal;hyphens:none}
.tile .nm .fn{font:500 12px/14px var(--cond);color:var(--muted)}
.tile .nm .ln{font:600 15px/19px var(--cond);letter-spacing:.005em}
.tile .nm .ln.brk{white-space:normal}
.tile .nm .ln.ell{text-overflow:ellipsis}
.tile.open .nm{font:600 16px/21px var(--cond);letter-spacing:.005em}
.tile .row2{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:8px}
.tile .bt{min-width:0;font:600 13.5px/18px var(--num);letter-spacing:0;color:var(--fg2);overflow-wrap:anywhere}
.tile .pr{flex:none;font:600 21px/24px var(--num);color:var(--fg);white-space:nowrap}
.tile .pr.noprice{font-size:15px;color:var(--muted)}
.tile .cv{font-size:12.5px;line-height:17px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tile .cv b{font-weight:700;color:var(--good)}
.tile .cv b.short{color:var(--bad)}
.tile .cv span{color:var(--fg2)}
.tile .ft{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;font-size:11.5px;line-height:15px}
.tagx{display:inline-flex;align-items:center;gap:3px;color:var(--fg2);white-space:nowrap}
.tagx.ok{color:var(--good)}
.tagx.new{color:var(--warn);font-weight:700;letter-spacing:.04em}
.tile.isnew{border-color:var(--warn)}
.tile .ft .sp-badge{margin-left:auto}
.seen-div{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted)}
.seen-div::before,.seen-div::after{content:"";flex:1;height:1px;background:var(--line2)}
.tagx svg{flex:none}
.own{display:inline-block;font:700 12px/16px var(--cond);letter-spacing:.06em;color:var(--fg);padding:0 4px;border:1px solid var(--line2);border-radius:3px;vertical-align:1px}
/* settled track (segmented stepper, driven by the pick's real state): Early -> Lineup -> Locked */
.stp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.stp .trk{display:inline-flex;align-items:center}
.stp .n{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2);background:transparent}
.stp .c{width:6px;height:1.5px;background:var(--line2)}
.stp .n.on{border-color:currentColor;background:currentColor}
.stp .c.on{background:currentColor}
.stp.early{color:var(--warn)} .stp.ok{color:var(--good)} .stp.lock{color:var(--muted)}
.stp .t{color:inherit;font-weight:600}
.stp.lock .t{color:var(--fg2)}
.xp .stp .n{width:8px;height:8px} .xp .stp .c{width:10px}
.chip.hollow{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--line2);border-radius:4px;font-size:11.5px;color:var(--fg2)}
/* opened tile */
.xp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px;color:var(--fg2)}
.xp>*+*{margin-top:8px}
.xp b{color:var(--fg);font-weight:700}
.xp .meta{font-size:12.5px;line-height:18px;color:var(--muted)}
.xp .chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;line-height:18px}
/* chance vs break-even: an edge meter. Centre tick = what the price needs, dot = our chance, red run = the edge */
.bar{position:relative;height:14px}
.bar::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line2);border-radius:1px}
.bar::after{content:"";position:absolute;left:0;right:0;top:4px;height:6px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.bar i{position:absolute;top:6px;height:2px;background:var(--good)}
.bar i.short{background:var(--bad)}
.bar u{position:absolute;top:1px;height:12px;width:2px;margin-left:-1px;background:var(--fg)}
.bar em{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--bg)}
.bar em.short{background:var(--bad)}
.chance{font-size:13.5px;line-height:19px;color:var(--fg2)}
.chance b{font-weight:700;color:var(--fg)}
/* tap to bet */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:6px;
  border:1px solid var(--line2);color:var(--fg);font:600 15px/20px var(--body)}
.btn.hr{width:100%;background:var(--cta);color:var(--on-primary);border-color:var(--cta);text-decoration:none;white-space:nowrap}
/* select to slip: Select mode swaps each tile's photo for a check circle; a bar at the bottom adds the picks to Hard Rock */
.sec-h.hasbtn{flex-wrap:wrap}
.sec-h.hasbtn h2{flex:1 0 auto}
.selbtn{display:flex;align-items:center;min-height:44px;margin:-11px -12px -11px 0;padding:0 12px;color:var(--accent);font:600 14px/20px var(--body)}
.tile .ck{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);color:var(--on-accent)}
.tile .ck svg{display:none}
.tile.sel .ck{background:var(--accent);border-color:var(--accent)}
.tile.sel .ck svg{display:block}
.tile .top.cr .ck{position:absolute;top:0;right:2px;width:22px;height:22px}
.tile .top.cr .fn{margin-right:12px}
.tile.selmode{transition:transform .12s}
.tile.selmode.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);
  background:linear-gradient(rgba(var(--accent-rgb),.1),rgba(var(--accent-rgb),.1)),var(--surface)}
.tile.selmode:active{transform:scale(.98)}
.tile.nosel{opacity:.6;cursor:default}
.tile.nosel:active{transform:none}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile.nudge{animation:nudge .24s}
.slipbar{position:fixed;bottom:0;right:0;left:calc(var(--w) + var(--sal));z-index:5;background:var(--surface);border-top:1px solid var(--line2);
  box-shadow:0 -6px 16px rgba(0,0,0,.35);padding:8px 0 calc(8px + var(--sab));transform:translateY(100%);visibility:hidden;transition:transform .18s ease-out,visibility 0s .18s}
.slipbar.show{transform:none;visibility:visible;transition:transform .18s ease-out}
@media (min-width:640px){.slipbar{left:calc(var(--w) + 24px)}}
.slipbar .in{max-width:560px;padding:0 14px}
.slipbar .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px}
.slipbar .cnt{font:600 15px/20px var(--body);min-width:0}
.slipbar .cnt.mu{font-weight:400}
.slipbar .warn{color:var(--warn)}
.slipbar .acts{display:flex;flex:none}
.slipbar .lk{display:flex;align-items:center;min-height:44px;margin:-12px 0;padding:0 8px;color:var(--accent);font:600 13px/18px var(--body)}
.slipbar .lk:last-child{margin-right:-8px}
.slipbar .note{margin-top:2px;font-size:12px;line-height:16px;color:var(--muted)}
.slipbar .btn.hr{min-height:48px;margin-top:8px;font-size:16px}
.slipbar .btn.hr:not([href]){opacity:.5;pointer-events:none}
.slipbar .btn.dk{min-height:44px;margin-top:8px;width:100%;text-decoration:none;white-space:nowrap}
/* TOO LATE: off the board before tip. Solid Dugout Navy stamp, the tile dimmed under it; the price is not struck */
.tile.late{border-color:var(--line)}
.tile.late .dimmed{opacity:.5}
.tl{display:block;margin:0 0 8px;padding:2px 0;border:1.5px solid var(--warn);border-radius:4px;color:var(--surface);background:var(--warn);text-align:center;
  font:700 14px/18px var(--cond);letter-spacing:.14em}
.tile.late .keep{margin-top:8px;font-size:12px;line-height:16px;color:var(--fg2)}

/* live */
.tonight{margin-top:12px;font:400 18px/24px var(--head);letter-spacing:.01em}
.lvupd{margin-top:6px;font-size:12.5px;line-height:17px;color:var(--muted)}
.lvupd.bad{color:var(--warn);font-weight:600}
/* Live cards sit two to a row, like the Picks board (2026-11-09, Matt: "so we can fit more") */
.lvlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.lv{display:flex;flex-direction:column;min-width:0;padding:9px 9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lv .top{display:flex;gap:7px;align-items:center;min-width:0}
.lv .hs{width:26px;height:26px}
.lv .nm{flex:1;min-width:0;font:600 15px/19px var(--cond);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv .row2{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:6px}
.lv .bt{min-width:0;font:600 13px/17px var(--num);color:var(--fg2);overflow-wrap:anywhere}
.lv .pp{flex:none;font:600 14px/17px var(--num);color:var(--muted);white-space:nowrap}
.lv .gs{margin-top:auto;padding-top:7px;font-size:12.5px;line-height:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv .gs b{color:var(--fg);font-weight:600}
.lv .gs .sc{white-space:nowrap}
.lv .pips{gap:3px} .lv .pip{width:11px;height:11px}
.lv .trk2 .meter{flex:1 1 56px;width:auto;min-width:0}
.lv .trk2 .msg{flex:1 0 100%;min-width:0;font:600 13px/17px var(--num);color:var(--fg);overflow-wrap:anywhere}
.lv .trk2 .stmp{flex:none;margin:0 0 0 auto;padding:0 5px;font-size:12px}
.lv.fin .trk2 .msg{color:var(--fg2)}
.stmp{display:inline-block;margin-top:5px;padding:1px 6px;border:1.5px solid var(--muted);border-radius:4px;color:var(--muted);font:700 13px/16px var(--cond);letter-spacing:.1em}
.stmp.W{border-color:var(--good);color:var(--good)} .stmp.L{border-color:var(--bad);color:var(--bad)}
.trk2{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:8px;font-size:12.5px;line-height:17px;color:var(--fg2)}
.pips{display:inline-flex;gap:4px;align-items:center}
.pip{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);background:transparent}
.pip.on{background:var(--good);border-color:var(--good)}
.pip.used{background:var(--warn);border-color:var(--warn)}
.pip.lose{border-color:var(--bad)}
.pip.lose.on{background:var(--bad)}
.lv.fin .nm,.lv.fin .pp{color:var(--fg2)}
.lv.open{grid-column:1 / -1;border-color:var(--accent);background:var(--accent-soft)}
.lv.open .nm{color:var(--fg)}
.lv-xp{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;line-height:18px;color:var(--fg2)}
.lv-xp>*+*{margin-top:5px}
.lv-xp b{color:var(--fg);font-weight:700;font-size:13px}
.lv-xp .lxm{color:var(--muted)}
/* stat meter for bigger lines (points, rebounds, assists): fill = his number so far, tick = the line */
.meter{position:relative;display:inline-block;width:96px;height:8px;border-radius:4px;background:var(--raise);border:1px solid var(--line2);overflow:hidden;vertical-align:middle}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.meter i.on{background:var(--good)} .meter i.used{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter u{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg)}

/* games */
.gl{margin-top:4px}
.gm{padding:12px 0;border-bottom:1px solid var(--line)}
.gm .g1{display:flex;align-items:baseline;gap:8px}
.gm .mt{flex:1;min-width:0;font:600 16px/22px var(--cond);letter-spacing:.01em}
.gm .pt{flex:none;font-size:13px;color:var(--fg2);white-space:nowrap}
.ck{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:18px;color:var(--fg2)}
.ck li{display:flex;gap:6px;align-items:flex-start;padding:1px 0}
.ck li .i{flex:none;display:flex;width:14px;height:18px;align-items:center;color:var(--accent)}
.ck li.wait .i{color:var(--muted)}
.ck li.nx{color:var(--accent)} .ck li.nx .i{color:var(--accent)}
.ck li.warn{color:var(--warn)} .ck li.warn .i{color:var(--warn)}
.ck li.done{color:var(--accent)}
.ck time{color:var(--fg);font-weight:600;white-space:nowrap}
.gm.started .mt{color:var(--muted)}

/* empty + skeleton */
.skel{position:relative;height:118px;border-bottom:1px solid var(--line)}
.skel::before,.skel::after{content:"";position:absolute;left:30px;background:var(--raise);border-radius:2px}
.skel::before{top:18px;width:55%;height:16px}
.skel::after{top:46px;width:38%;height:12px}
.skel.sm::before,.skel.sm::after{display:none}
.skel.sm{height:20px;width:60%;border:0;background:var(--raise);border-radius:3px;margin-top:14px}
.loading{font-size:13px;margin:12px 0 4px}
.stack>*+*{border-top:1px solid var(--line)}

/* footer */
.foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* side rail dock: the page's navigation, pinned to the left edge */
.tabs{position:fixed;left:0;top:0;bottom:0;z-index:7;width:calc(var(--w) + var(--sal));padding:calc(var(--sat) + 8px) 0 calc(var(--sab) + 8px) var(--sal);
  background:var(--surface);border-right:1px solid var(--line)}
.rail{position:relative;display:flex;flex-direction:column;height:100%}
.rail .grp{position:relative;display:flex;flex-direction:column}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:var(--w);height:var(--h);color:var(--muted)}
.tab .ico{display:flex;align-items:center;justify-content:center;width:36px;height:30px;border-radius:7px;transition:background-color .2s,color .2s}
.tab .cap{font:600 11px/12px var(--cond);letter-spacing:.03em;color:var(--accent);display:none;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ico{background:var(--accent-soft)}
.tab[aria-current="page"] .cap{display:block}
.tab .lbl{position:absolute;left:calc(100% + 6px);top:50%;z-index:2;padding:5px 10px;border-radius:5px;background:var(--raise);border:1px solid var(--line2);
  color:var(--fg);font:600 13px/18px var(--body);white-space:nowrap;pointer-events:none;
  opacity:0;transform:translate(-8px,-50%);transition:opacity .16s ease,transform .2s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.tab:hover .lbl{opacity:1;transform:translate(0,-50%)} .tab:hover{color:var(--fg)} .tab[aria-current="page"]:hover{color:var(--accent)}}
.tab:focus-visible{outline:none}
.tab:focus-visible .ico{outline:2px solid var(--accent);outline-offset:1px}
.tab:focus-visible .lbl{opacity:1;transform:translate(0,-50%)}
.tab .dot{position:absolute;top:calc(50% - 15px);right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tab .dot.ok{background:var(--accent)} .tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--primary)}
/* how many open picks, on the Picks item */
.tab .cnt{position:absolute;top:calc(50% - 21px);left:calc(50% + 3px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--primary);color:var(--on-primary);font:600 11px/17px var(--num);text-align:center;box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.rail .ind{position:absolute;left:0;top:0;width:3px;height:var(--h);border-radius:0 2px 2px 0;background:var(--accent);opacity:0;pointer-events:none}
.rail .ind.on{opacity:1}
.rail.ready .ind{transition:transform .28s cubic-bezier(.3,.7,.2,1),height .28s}
@media (prefers-reduced-motion:reduce){
  .rail.ready .ind,.tab .lbl,.tab .ico{transition:none}
  .slipbar,.slipbar.show,.tile.selmode{transition:none}
  .tile.nudge{animation:none}
  .tile.selmode:active{transform:none}
}

/* record */
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:14px}
.big .wl{font:600 38px/46px var(--num);letter-spacing:.01em}
.big .un{font:600 26px/34px var(--num)}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.hitline{margin-top:10px}
.hitline .bar{margin-top:4px}
.tbl{margin-top:8px;font-size:13px;line-height:18px;border-top:1px solid var(--line2)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 54px 86px;column-gap:6px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:11px;line-height:15px;color:var(--muted);padding:6px 0 5px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .num{font:600 15px/18px var(--num)}
.tr .lbl small{display:block;font-size:11px;line-height:14px;color:var(--warn)}
.tr .hv{font-size:12px;color:var(--fg2)}
button.tr{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button.tr.open{background:var(--selected-bg);border-bottom-color:transparent}
.tr .chev{display:inline-block;width:12px;color:var(--muted);font-weight:700;transition:transform .15s}
.tr .chev.on{transform:rotate(90deg);color:var(--selected-text)}
.cutl{padding:2px 0 10px 12px;border-left:2px solid var(--selected-text);margin:0 0 6px;background:var(--surface)}
.cutl .cutd{font-size:11px;line-height:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
@media (prefers-reduced-motion:reduce){.tr .chev{transition:none}}
.cut h3,.night h3,.cal-h h3{font:400 14px/20px var(--head);letter-spacing:.01em;margin:0}
.cut{margin-top:16px}
.cut .cn{font-size:11.5px;line-height:15px;color:var(--muted);margin-top:1px}
/* month calendar: Stitch Red up, Slate down, darker = bigger; outline = no picks */
.cal-h{display:flex;align-items:center;gap:4px;margin-top:20px}
.cal-h h3{flex:1;min-width:0}
.mnav{width:44px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent);border:1px solid var(--line2);border-radius:6px}
.mnav[disabled]{color:var(--line2);cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:8px}
.cal .wd{font-size:10.5px;line-height:14px;color:var(--muted);text-align:center}
.cd{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:46px;padding:3px 4px;border-radius:4px;
  background:var(--raise);font-size:10.5px;line-height:13px;color:var(--muted);overflow:hidden}
.cd.none{background:transparent;border:1px solid var(--line)}
.cd.blank{background:transparent}
.cd.has{color:var(--fg)}
.cd .u{font:600 11px/13px var(--num);color:var(--fg);white-space:nowrap}
.cd .wl-sm{font:600 9px/11px var(--num);color:var(--fg);white-space:nowrap}
.cd.even{background:var(--raise);border:1px solid var(--line2)}
.cd.open{border:1px dashed var(--accent)}
.cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.cd.dark .wl-sm,.cd.dark .u{color:var(--surface)}
.cd.dark{color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11px;line-height:15px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dayd{margin-top:10px}
.filters{display:inline-flex;margin:12px 0 0;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.night{margin-top:20px}
.night h3{padding-bottom:6px;border-bottom:1px solid var(--line2)}
.night h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:40px;font:700 16px/20px var(--cond);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:650}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ptag{display:inline-block;font:700 11px/15px var(--cond);letter-spacing:.07em;padding:0 4px;margin-right:6px;border:1px solid var(--warn);border-radius:3px;color:var(--warn);vertical-align:1px}
.ptag.scr{border-color:var(--line2);color:var(--muted)}

/* lab */
.lab{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lab h3{font:400 16px/22px var(--head);margin:0}
.lab .rl{font-size:13px;line-height:19px;color:var(--fg2);margin-top:4px}
.lab .sm{font-size:12px;line-height:17px;color:var(--muted);margin-top:4px}
.lab{padding:0;overflow:hidden}
.lab-d{display:flex;gap:10px;align-items:baseline;margin-top:10px;font:600 12px/17px var(--num);letter-spacing:.04em;text-transform:uppercase}
.lab-b{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.lab-b:last-child{border-bottom:0}
/* lab cards: a dashed border means paper, solid means real picks */
.lab-lede{margin:10px 0 0;font-size:13px;line-height:19px;color:var(--muted)}
.lab-chips{display:flex;gap:8px;margin:12px -14px 0;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.lab-chips::-webkit-scrollbar{display:none}
.lab-chip{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:22px;background:transparent;color:var(--fg2);font:600 12px/16px var(--num);white-space:nowrap;cursor:pointer}
.lab-chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.lab-chip:focus-visible,.lc-dh:focus-visible,.lc-more:focus-visible,.lab-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lab-list{max-width:560px}
.lc{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;scroll-margin-top:72px}
.lc.paper{border-style:dashed;border-color:var(--line2)}
.lc-h{display:flex;flex-direction:column;gap:10px;width:100%;min-height:96px;padding:14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lc-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lc-l1{display:flex;align-items:flex-start;gap:8px}
.lc-nm{flex:1;min-width:0;font:400 14px/19px var(--head);overflow-wrap:anywhere}
.lc-pill{flex:none;height:20px;padding:0 8px;border:1px solid var(--accent);border-radius:10px;font:600 11px/18px var(--num);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--accent)}
.lc-pill.ready{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.lc-pill.check{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lc-pill.good{border-color:var(--good);color:var(--good)}
.lc-pill.bad{border-color:var(--bad);color:var(--bad)}
.lc-pill.starting{border-color:var(--muted);color:var(--muted)}
.lc-pl{font-size:14px;line-height:20px;color:var(--fg2)}
.lc-l3{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.lc-ml{font-size:12px;line-height:17px;color:var(--muted)}
.lc-rec{font:600 14px/19px var(--num);text-align:right;white-space:nowrap}
.lc-meter{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.lc-meter::after{content:"";position:absolute;left:25%;top:0;bottom:0;width:1px;background:var(--line2)}
.lc-meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.lc-meter i.good{background:var(--good)}
.lc-meter i.bad{background:var(--bad)}
.lc-meter i.warn{background:var(--warn)}
.lc-meter i.anim{animation:lc-fill .6s ease-out}
.lc-un{font:600 15px/19px var(--num);text-align:right;white-space:nowrap}
.lc-l4{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lc-tag{display:flex;align-items:center;gap:6px;min-width:0;font:400 11px/16px var(--num);letter-spacing:.02em;color:var(--muted)}
.lc-tag.real{color:var(--good)}
.lc-dash{flex:none;width:10px;height:10px;border:1px dashed var(--muted);border-radius:50%}
.lc-chev{flex:none;display:inline-flex;color:var(--muted);transition:transform .16s ease-out}
.lc-chev.open{transform:rotate(90deg)}
.lc-grow{display:grid;grid-template-rows:1fr}
.lc-grow-in{min-height:0;overflow:hidden}
.lc-grow.anim{animation:lc-grow var(--lc-ms,180ms) ease-out}
.lc-x{padding:0 14px 4px}
.lc-blk{margin-top:16px}
.lc-bh,.lc-lab{font:400 12px/17px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lc-row{display:flex;gap:10px;margin-top:10px}
.lc-ic{flex:none;display:inline-flex;margin-top:1px;color:var(--accent)}
.lc-rb{min-width:0}
.lc-tx{font-size:14px;line-height:20px;color:var(--fg)}
.lc-note{margin-top:2px;font-size:12px;line-height:17px;color:var(--muted)}
.lc-chips{display:grid;gap:8px;margin-top:8px}
.lc-chips.c4,.lc-chips.c2{grid-template-columns:1fr 1fr}
.lc-chips.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.lc-chip{min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
.lc-cl{font:400 11px/16px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lc-cv{font:600 18px/24px var(--num);overflow-wrap:anywhere}
.lc-cs{font-size:11px;line-height:15px;color:var(--muted)}
.lc-spark{position:relative;height:56px;margin-top:8px}
.lc-spark svg{display:block;width:100%;height:100%;overflow:visible}
.lc-spark .area{fill:var(--accent-soft);stroke:none}
.lc-spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.lc-spark .zero{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 3}
.lc-spark .dot{position:absolute;right:-2px;width:5px;height:5px;margin-top:-2px;border-radius:50%;background:var(--muted)}
.lc-spark .dot.good{background:var(--good)}
.lc-spark .dot.bad{background:var(--bad)}
.lc-spark.anim svg{animation:lc-draw .5s ease-out}
.lc-spark.anim .dot{animation:lc-dot .5s ease-out}
.lc-dates{display:flex;justify-content:space-between;margin-top:4px;font-size:11px;line-height:16px;color:var(--muted)}
.lc-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.lc-col{padding-left:10px;border-left:2px solid var(--line)}
.lc-col.hot{border-left-color:var(--good)}
.lc-col .lc-lab{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-family:var(--body)}
.lc-col .lc-lab svg{color:var(--muted)}
.lc-col:first-child .lc-lab svg{color:var(--good)}
.lc-tx2{margin-top:2px;font-size:13px;line-height:18px;color:var(--fg)}
.lc-fade{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:13px;line-height:18px}
.lc-blk>.lc-cs{margin-top:4px}
.lc-none{font-size:12px;line-height:17px;color:var(--muted)}
.lc-drs{margin:16px -14px 0}
.lc-dr{border-top:1px solid var(--line)}
.lc-dh{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 14px;background:none;border:0;color:var(--fg);font:600 13px/18px var(--body);text-align:left;cursor:pointer}
.lc-math{padding:0 14px 12px}
.lc-mb+.lc-mb{margin-top:10px}
.lc-ml2{font-size:12px;line-height:17px;color:var(--muted)}
.lc-mt2{font-size:12px;line-height:18px;color:var(--fg2);overflow-wrap:anywhere}
.lc-mt2.warn{color:var(--warn)}
.lc-picks{padding:0 14px 6px}
.lc-more{display:block;width:100%;min-height:44px;background:none;border:0;color:var(--accent);font:600 13px/18px var(--body);text-align:left;cursor:pointer}
.lc-nolist{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;line-height:17px;color:var(--muted)}
.lab-link{display:block;min-height:44px;margin-top:2px;padding:0;background:none;border:0;color:var(--accent);font:600 13px/18px var(--body);text-align:left;cursor:pointer}
@keyframes lc-fill{from{width:0}}
@keyframes lc-grow{from{grid-template-rows:0fr}to{grid-template-rows:1fr}}
@keyframes lc-draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes lc-dot{0%,90%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .lc-meter i.anim,.lc-grow.anim,.lc-spark.anim svg,.lc-spark.anim .dot{animation:none}
  .lc-chev{transition:none}
}
.lab-ret{margin-top:14px}
.lab-ret-b{display:block;width:100%;min-height:44px;padding:10px 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.lab-ret-b:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lab-ret .sm{font-size:12px;line-height:17px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.lab-b .who{min-width:0;overflow-wrap:anywhere}
.lab-b .res{flex:none;font-weight:600}

/* info: update status, one row per feed with its state, like a service status page */
.svc-h{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:12px 0 6px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-weight:650}
.svc-h.bad{border-left-color:var(--primary);background:var(--selected-bg)}
.svc-h .ic{display:flex;color:var(--accent)} .svc-h.bad .ic{color:var(--primary)}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:19px}
.kv .k{color:var(--muted);font-size:12.5px;display:flex;align-items:baseline;gap:6px}
.kv .k i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);transform:translateY(-1px)}
.kv .k i.bad{background:var(--primary)} .kv .k i.na{background:var(--line2)}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv .v.bad{color:var(--selected-text)}
.rules{margin:10px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere;color:var(--fg2)}
.rules li::marker{color:var(--muted);font:700 14px var(--cond)}
.slot{font-weight:650;color:var(--fg);white-space:nowrap}
.plain{margin:10px 0 0;padding:0 0 0 18px;font-size:13.5px;line-height:20px;color:var(--fg2)}
.plain li{margin:0 0 6px}
.fixed{margin:10px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;line-height:19px;font-weight:600;color:var(--fg)}

.rf-row{display:flex;gap:6px;overflow-x:auto;margin:14px 0 2px;padding-bottom:2px;scrollbar-width:none}.rf-row::-webkit-scrollbar{display:none}
.rf-btn{flex:0 0 auto;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:16px;background:var(--surface);color:var(--fg2);font:inherit;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}.rf-btn.on{background:var(--selected-bg);color:var(--selected-text);border-color:var(--selected-bg)}
.rf-clr{margin-left:4px;flex:0 0 auto;height:32px;padding:0 10px;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer}
/* P1: confidence badge */
.tagx.conf{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px}

.wl-strip{display:flex;gap:6px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.wl-strip::-webkit-scrollbar{display:none}
.wl-day{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:48px;height:32px;border-radius:6px;font:700 12.5px var(--cond);border:1px solid var(--line)}

        }
      }
      ahRows.sort(function(a, b) { return b.units - a.units; });
      ahRows = ahRows.slice(0, 3);
    }
  }
  if (ahRows.length) {
    labTbl.appendChild(labSubHeader('nba', 'NBA', 'AH filters'));
    for (var ai = 0; ai < ahRows.length; ai++) {
      var ar = ahRows[ai];
      labTbl.appendChild(labRow(ar.label, ar.w, ar.l, ar.units, ar.n, hqGate(nba.labCfg, function(t) { return t.stats === ar.key; })));
    }
  }

  sec5.appendChild(labTbl);
  sec5.appendChild(h('div', { style: 'margin-top:8px;font-size:12px;color:var(--muted)', text: 'Research only. Gate: NHL ' + (nhlGate != null ? nhlGate : '—') + ' graded · NBA ' + (nbaGate != null ? nbaGate : '—') + ' graded.' }));
  var hqRetired = (num(nhl.labCfg && nhl.labCfg.retired_count) || 0) + (num(nba.labCfg && nba.labCfg.retired_count) || 0);
  if (hqRetired) sec5.appendChild(h('div', { style: 'margin-top:6px;font-size:12px;color:var(--muted)', text: hqRetired + ' retired' }));
  app.appendChild(sec5);

  /* --- Section 4: Tonight's Slate --- */
  var sec4 = h('section', { class: 'sec' },
    h('div', { class: 'sec-h' }, h('h2', { text: "Tonight's slate" })));

  var slateGrid = h('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px' });

  function slateCol(sportLabel, sportCls, st, sl) {
    var col = h('div', { style: 'padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)' });
    col.appendChild(h('span', { class: 'sp-badge ' + sportCls, text: sportLabel }));

    var gamesT = st ? (num(st.games_today) != null ? st.games_today : (st.plan ? st.plan.games_today : null)) : null;
    col.appendChild(h('div', { style: 'margin-top:8px;font-size:13px;color:var(--fg2)' },
      h('span', { style: 'color:var(--muted)', text: 'Games: ' }),
      h('span', { style: 'font:600 14px/18px var(--num)', text: gamesT != null ? String(gamesT) : '—' })));

    var openPicks = 0;
    if (sl && arr(sl.picks).length) {
      openPicks = arr(sl.picks).filter(function(p) { return !p.pulled && !isObj(p.result) && !isObj(p.graded); }).length;
    }

    if (openPicks === 0) {
      col.appendChild(h('div', { style: 'margin-top:6px;font-size:12.5px;color:var(--muted)', text: 'No picks yet — checking every 10 min' }));
    } else {
      var cnt = h('span', { class: 'cnt', style: 'position:static;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font:600 12px/17px var(--num);box-shadow:none' });
      cnt.textContent = String(openPicks);
      col.appendChild(h('div', { style: 'margin-top:6px;display:flex;align-items:center;gap:6px;font-size:13px' }, cnt, h('span', { style: 'color:var(--fg2)', text: 'open pick' + (openPicks !== 1 ? 's' : '') })));
    }

    /* last run time */
    var lastRunAt = st ? (ms(st.finished_at) || ms(st.status_at)) : null;
    var lastRunStr = lastRunAt ? fTime(lastRunAt) : null;
    col.appendChild(h('div', { style: 'margin-top:6px;font-size:12px;color:var(--muted)', text: 'Next run: every ~10 min' + (lastRunStr ? ' · Last ' + lastRunStr : '') }));

    return col;
  }

  slateGrid.appendChild(slateCol('NHL', 'nhl', nhl.status, nhl.slate));
  slateGrid.appendChild(slateCol('NBA', 'nba', nba.status, nba.slate));
  sec4.appendChild(slateGrid);
  app.appendChild(sec4);

  /* --- Refresh button --- */
  var refSec = h('div', { style: 'margin-top:18px;text-align:center' });
  refSec.appendChild(h('button', { class: 'chip hollow', type: 'button', text: 'Refresh HQ', on: { click: function() {
    S.hq = null; loadHQ();
  } } }));
  app.appendChild(refSec);

  app.appendChild(h('footer', { class: 'foot' }, h('p', { text: 'All times Eastern. Data as of ' + (S.hq.loadedAt ? fTime(S.hq.loadedAt) : '—') + '.' })));
}

RENDER = { picks: renderPicks, live: renderLive, games: renderGames, record: renderRecord, lab: renderLab, info: renderInfo, hq: renderHQ };

/* ---------- side rail dock + routing ---------- */
/* Side rail dock: built once so the accent bar can slide; each render only updates which item is current and the status
   dot (on Info). Labels slide out on hover (mouse) and keyboard focus; on touch only the current item's caption shows. */
var RAIL = [['picks', 'Picks', 'ticket'], ['live', 'Live', 'pulse'], ['games', 'Games', 'court'], ['record', 'Record', 'ledger'], ['lab', 'Lab', 'flask'], ['info', 'Info', 'info'], ['hq', 'HQ', 'hq']];
var rail = { el: null, ind: null, btns: {}, dot: null, at: null };
function freshLevel() {
  if (!S.loaded) return null;
  if (!S.slate) return 'bad';
  if (S.fetchFail) return 'bad';
  if (expired()) return 'warn';
  var st = isObj(S.slate.status) ? S.slate.status : {}, od = oddsSt(), fd = isObj(st.feeds) ? st.feeds : {};
  if (od.no_keys || od.refused || od.low) return 'warn';
  if (fd.schedule === false || fd.injuries === false || (isObj(fd.lineups) && fd.lineups.ok === false)) return 'warn';
  if (isObj(st.last_run) && st.last_run.ok === false) return 'warn';
  return 'ok';
}
function railBtn(label, ic, extra, onClick) {
  return h('button', Object.assign({ class: 'tab', type: 'button', 'aria-label': label, on: { click: onClick } }, extra || {}),
    h('span', { class: 'ico' }, icon(ic, 22, '1.9')), h('span', { class: 'cap', 'aria-hidden': 'true', text: label }),
    h('span', { class: 'lbl', 'aria-hidden': 'true', text: label }));
}
function buildRail() {
  rail.btns = {};
  clear(tabsEl);
  var main = h('div', { class: 'grp' });
  rail.ind = h('span', { class: 'ind', 'aria-hidden': 'true' });
  main.appendChild(rail.ind);
  RAIL.forEach(function (r) {
    var b = railBtn(r[1], r[2], { 'data-view': r[0] }, function () { go(r[0]); });
    rail.btns[r[0]] = b; main.appendChild(b);
  });
  rail.dot = h('span', { class: 'dot', 'aria-hidden': 'true' }); rail.btns.info.appendChild(rail.dot);
  rail.liveDot = h('span', { class: 'dot', 'aria-hidden': 'true' }); rail.liveDot.hidden = true; rail.btns.live.appendChild(rail.liveDot);
  rail.cnt = h('span', { class: 'cnt', 'aria-hidden': 'true' }); rail.cnt.hidden = true; rail.btns.picks.appendChild(rail.cnt);
  rail.el = h('div', { class: 'rail' }, main);
  rail.el.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var all = Array.prototype.slice.call(rail.el.querySelectorAll('.tab')), i = all.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault(); all[(i + (e.key === 'ArrowDown' ? 1 : all.length - 1)) % all.length].focus();
  });
  tabsEl.appendChild(rail.el);
  window.addEventListener('resize', function () { placeInd(true); });
}
function placeInd(force) {
  var b = rail.btns[S.view]; if (!b || !rail.ind) return;
  if (!force && rail.at === S.view) return;
  rail.at = S.view;
  rail.ind.style.transform = 'translateY(' + b.offsetTop + 'px)';
  rail.ind.style.height = b.offsetHeight + 'px';
  rail.ind.className = 'ind on';
  if (!rail.el.classList.contains('ready')) requestAnimationFrame(function () { rail.el.classList.add('ready'); });   /* no slide on first paint */
}
function renderTabs() {
  if (!rail.el) buildRail();
  renderSwitcher();
  RAIL.forEach(function (r) {
    var b = rail.btns[r[0]];
    if (!b) return;
    if (S.view === r[0]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var lv = freshLevel();
  if (rail.dot) { rail.dot.className = 'dot' + (lv ? ' ' + lv : ''); rail.dot.hidden = !lv || lv === 'ok'; }
  if (rail.liveDot) {
    var hasLive = false;
    if (S.loaded) {
      if (S.allResults) {
        arr(S.allResults).forEach(function (r) {
          if (!r.slate.ok) return;
          var sv = S.sport, sl = S.slate, sr = S.record;
          S.sport = r.sport; S.slate = r.slate.v; S.record = r.record.ok ? r.record.v : null;
          if (split().started.length) hasLive = true;
          S.sport = sv; S.slate = sl; S.record = sr;
        });
      } else if (S.slate) {
        hasLive = split().started.length > 0;
      }
    }
    rail.liveDot.className = 'dot ok';
    rail.liveDot.hidden = !hasLive;
  }
  /* open picks for the chosen sport (All = both: S.slate is the merged slate), the same number as the "Picks (N)" heading.
     Nothing while loading, with no slate, on an old slate, or at zero. */
  if (rail.cnt && rail.btns.picks) {
    var nOpen = (S.loaded && S.slate && !expired()) ? split().open.length : 0;
    rail.cnt.textContent = nOpen > 99 ? '99+' : String(nOpen);
    rail.cnt.hidden = !nOpen;
    rail.btns.picks.setAttribute('aria-label', nOpen ? 'Picks, ' + nOpen + ' open' : 'Picks');
  }
  placeInd(false);
}
var HASH_VIEWS = { '#live': 'live', '#games': 'games', '#record': 'record', '#lab': 'lab', '#backstage': 'lab', '#info': 'info', '#status': 'info', '#hq': 'hq' };
function viewFromHash() { return HASH_VIEWS[location.hash] || 'picks'; }
function go(v) {
  if (v === S.view) { window.scrollTo(0, 0); return; }
  try {
    if (v !== 'picks') history.pushState(null, '', location.pathname + location.search + '#' + v);
    else history.pushState(null, '', location.pathname + location.search);
  } catch (e) { location.hash = v !== 'picks' ? '#' + v : ''; }
  route();
}
function route() {
  var v = viewFromHash();
  if (v !== S.view) {
    S.scroll[S.view] = window.scrollY || 0; S.view = v; S.labFilter = null; render(); window.scrollTo(0, S.scroll[v] || 0);
    if (v === 'live' || v === 'lab') liveGo(true); else liveStop();
    if (v === 'hq') loadHQ();
  }
}

/* ---------- wiring ---------- */
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { writeSeen(); liveStop(); } else { liveGo(true); load().then(schedule); }
});
window.addEventListener('pageshow', function () { liveGo(true); });
window.addEventListener('focus', function () { liveGo(true); });
setInterval(liveTick, 1000);   /* "Updated Xs ago" on Live */
window.addEventListener('pagehide', writeSeen);
setInterval(function () { if (S.loaded && !document.hidden) maybeRender(); }, 30000);   /* "to tip", stale and live checks tick on */

S.view = viewFromHash();
renderTabs();
load().then(schedule);
if (S.view === 'hq') loadHQ();
})();
(function() {
  if (!('wakeLock' in navigator)) return;
  var wl = null;
  function req() {
    navigator.wakeLock.request('screen').then(function(lock) {
      wl = lock;
      lock.addEventListener('release', function() { wl = null; });
    }).catch(function() {});
  }
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') req();
  });
  req();
})();
</script>
</body>
</html>
