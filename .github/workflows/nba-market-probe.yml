# NBA: One-time research read of every player-prop market Hard Rock posts (sports/nba/research/market_probe.py).
name: nba-market-probe
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-market-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: sports/nba
        env:
          ODDS_API_KEYS: ${{ secrets.NBA_ODDS_API_KEYS }}
          ODDS_API_KEYS_2: ${{ secrets.NBA_ODDS_API_KEYS_2 }}
        run: python research/market_probe.py
      - run: |
          git config user.name "prop-check-bot" && git config user.email "bot@users.noreply.github.com"
          git add sports/nba/research/market_probe
          git commit -qm "research: NBA all-markets probe [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
