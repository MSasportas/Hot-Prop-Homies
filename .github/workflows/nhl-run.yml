# NHL pipeline timer — cron offset, push paths, and secret mapping for NHL.
# Shared execution logic: .github/workflows/sport-run.yml
# To change NHL independently: edit this file only.
name: nhl-run
on:
  workflow_dispatch:
    inputs:
      chain_link:
        description: 'Which link of the chain this is (set by the previous run)'
        required: false
        default: '0'
      chain_started_at:
        description: 'When the chain began (set by the previous run)'
        required: false
        default: ''
  schedule:
    - cron: '23 * * * *'      # restarter only (offset from NBA to avoid simultaneous starts)
  push:                       # a code or rule change starts a chain right away
    branches: [main]
    paths: ['sports/nhl/scripts/**', 'sports/nhl/config/**', '.github/workflows/nhl-run.yml']
jobs:
  run:
    uses: ./.github/workflows/sport-run.yml
    with:
      sport: nhl
      chain_link: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_link || '0' }}
      chain_started_at: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_started_at || '' }}
    secrets:
      ODDS_API_KEYS: ${{ secrets.NHL_ODDS_API_KEYS }}
      ODDS_API_KEYS_2: ${{ secrets.NHL_ODDS_API_KEYS_2 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.NHL_DISCORD_WEBHOOK }}
