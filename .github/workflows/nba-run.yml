# NBA pipeline timer — cron offset, push paths, and secret mapping for NBA.
# Shared execution logic: .github/workflows/sport-run.yml
# To change NBA independently: edit this file only.
name: nba-run
on:
  workflow_dispatch:
    inputs:
      chain_link:
        description: 'Which link of the chain this is (set by the previous run)'
        required: false
        default: '0'
      chain_started_at:
        description: 'When the chain began (set by the previous run)'
        required: false
        default: ''
  schedule:
    - cron: '17 * * * *'      # restarter only
  push:                       # a code or rule change starts a chain right away
    branches: [main]
    paths: ['sports/nba/scripts/**', 'sports/nba/config/**', '.github/workflows/nba-run.yml']
jobs:
  run:
    uses: ./.github/workflows/sport-run.yml
    with:
      sport: nba
      chain_link: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_link || '0' }}
      chain_started_at: ${{ github.event_name == 'workflow_dispatch' && inputs.chain_started_at || '' }}
    secrets:
      ODDS_API_KEYS: ${{ secrets.NBA_ODDS_API_KEYS }}
      ODDS_API_KEYS_2: ${{ secrets.NBA_ODDS_API_KEYS_2 }}
      DISCORD_WEBHOOK_URL: ${{ secrets.NBA_DISCORD_WEBHOOK }}
